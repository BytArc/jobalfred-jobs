# Curated boards. Every token was checked against the live API on the date below.
# identity: how we know the board belongs to the company. Greenhouse returns a board name; Lever and
# Ashby return none, so the company name must appear in the postings. Common words were read by hand.
# hq is the headquarters country, from general knowledge. The india list leaves out companies
# headquartered or founded in India, because their offices there are not global capability centres.
verified_on: "2026-11-05"
companies:
  - name: "1Password"
    ats: ashby
    token: "1password"
    hq: "CA"
    identity: "name in postings"
    lists: [remote_eu, portugal, visa_eu]
